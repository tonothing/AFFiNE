name: Sync Affine (multi-arch squash)

on:
  push:
    branches: [dev]
  schedule:
    - cron: '0 0 */7 * *'
  workflow_dispatch:

env:
  UPSTREAM_IMAGE: ghcr.io/toeverything/affine
  UPSTREAM_TAG: stable
  MY_REGISTRY: ghcr.io
  MY_IMAGE_NAME: ${{ github.repository_owner }}/affine

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    outputs:
      build: ${{ steps.check.outputs.build }}
      digest: ${{ steps.check.outputs.digest }}
      match_tags: ${{ steps.check.outputs.match_tags }}

    steps:
      - name: Install tools (skopeo, jq)
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo jq

      - name: Check for Updates
        id: check
        run: |
          set -euo pipefail

          echo "Fetching upstream digest..."
          UPSTREAM_DIGEST=$(skopeo inspect docker://${{ env.UPSTREAM_IMAGE }}:${{ env.UPSTREAM_TAG }} --format '{{.Digest}}')
          echo "Upstream Stable Digest: $UPSTREAM_DIGEST"

          # 我方镜像记录的 upstream_digest label（没有则 none）
          LOCAL_LABEL=$(skopeo inspect docker://${{ env.MY_REGISTRY }}/${{ env.MY_IMAGE_NAME }}:stable --format '{{.Labels.upstream_digest}}' 2>/dev/null || echo "none")

          if [ "$UPSTREAM_DIGEST" == "$LOCAL_LABEL" ]; then
            if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
              echo "::notice::Manual trigger detected. Forcing build regardless of digest match."
            else
              echo "::notice::Image is up to date."
              echo "build=false" >> $GITHUB_OUTPUT
              exit 0
            fi
          else
            echo "::notice::Update found ($UPSTREAM_DIGEST). Scanning for matching tags..."
          fi

          echo "build=true" >> $GITHUB_OUTPUT
          echo "digest=$UPSTREAM_DIGEST" >> $GITHUB_OUTPUT

          # 获取上游所有 Tags 并过滤
          ALL_TAGS=$(skopeo list-tags docker://${{ env.UPSTREAM_IMAGE }} | jq -r '.Tags[]' | grep -vE 'canary|beta|^stable$' || true)

          : > matched_tags.txt

          if [ -n "${ALL_TAGS}" ]; then
            echo "${ALL_TAGS}" | xargs -I {} -P 20 sh -c '
              set -e
              TAG="{}"
              DIGEST=$(skopeo inspect --format "{{.Digest}}" docker://${{ env.UPSTREAM_IMAGE }}:$TAG 2>/dev/null || echo "error")
              if [ "$DIGEST" = "'$UPSTREAM_DIGEST'" ]; then
                echo "$TAG" >> matched_tags.txt
                echo "Found match: $TAG"
              fi
            '
          else
            echo "No tags to scan after filtering."
          fi

          MATCHED=$(cat matched_tags.txt | sort -u || true)
          MATCHED_ONE_LINE=$(echo "$MATCHED" | tr '\n' ' ' | xargs || true)

          echo "Final matching tags to push: $MATCHED_ONE_LINE"
          echo "match_tags=$MATCHED_ONE_LINE" >> $GITHUB_OUTPUT

  build-per-arch:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            suffix: amd64
          - platform: linux/arm64
            suffix: arm64
          - platform: linux/arm/v7
            suffix: armv7

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools (pip, skopeo)
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo python3-pip

      - name: Install docker-squash
        run: |
          pip install docker-squash

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Build Context
        env:
          UPDATE_SH: ${{ secrets.UPDATE_SCRIPT }}
          DOCKERFILE: ${{ secrets.DOCKERFILE_CONTENT }}
          ORIGIN_DATA: ${{ secrets.ORIGIN_DATA }}
          CUSTOM_DATA: ${{ secrets.CUSTOM_DATA }}
        run: |
          python -c "import os; open('update.sh', 'w').write(os.environ.get('UPDATE_SH', ''))"
          chmod +x update.sh
          python -c "import os; open('Dockerfile', 'w').write(os.environ.get('DOCKERFILE', ''))"
          python -c "import os; open('origin_data', 'w').write(os.environ.get('ORIGIN_DATA', ''))"
          python -c "import os; open('custom_data', 'w').write(os.environ.get('CUSTOM_DATA', ''))"
          echo "Build context prepared."

      - name: Build (per-arch, load)
        run: |
          set -euo pipefail
          echo "Building for ${{ matrix.platform }} ..."

          docker buildx build \
            --platform ${{ matrix.platform }} \
            --label upstream_digest="${{ needs.check.outputs.digest }}" \
            -t temp-affine:${{ matrix.suffix }} \
            --load \
            .

      - name: Squash & Push (per-arch tag)
        run: |
          set -euo pipefail

          ARCH_TAG="${{ env.MY_REGISTRY }}/${{ env.MY_IMAGE_NAME }}:stable-${{ matrix.suffix }}"
          echo "Squashing into ${ARCH_TAG} ..."

          docker-squash -f 2 -t "${ARCH_TAG}" "temp-affine:${{ matrix.suffix }}"

          echo "Pushing ${ARCH_TAG} ..."
          docker push "${ARCH_TAG}"

  assemble-manifest:
    needs: [check, build-per-arch]
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create stable multi-arch manifest
        run: |
          set -euo pipefail

          BASE="${{ env.MY_REGISTRY }}/${{ env.MY_IMAGE_NAME }}"
          echo "Creating multi-arch manifest for ${BASE}:stable ..."

          docker buildx imagetools create \
            -t "${BASE}:stable" \
            "${BASE}:stable-amd64" \
            "${BASE}:stable-arm64" \
            "${BASE}:stable-armv7"

      - name: Create matched tags multi-arch manifests
        run: |
          set -euo pipefail

          BASE="${{ env.MY_REGISTRY }}/${{ env.MY_IMAGE_NAME }}"
          MATCHED="${{ needs.check.outputs.match_tags }}"

          if [ -z "${MATCHED}" ]; then
            echo "No matched tags to assemble."
            exit 0
          fi

          for tag in ${MATCHED}; do
            echo "Creating multi-arch manifest for ${BASE}:${tag} ..."

            docker buildx imagetools create \
              -t "${BASE}:${tag}" \
              "${BASE}:stable-amd64" \
              "${BASE}:stable-arm64" \
              "${BASE}:stable-armv7"
          done

          echo "All manifests created."
